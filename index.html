<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Focusly — Calm Academic Focus & Study OS</title>
    
    <!-- PWA Manifest & App Identity -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1c1d21" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    
    <!-- iOS / Safari Standalone PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Focusly" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />

    <!-- Google Fonts: Plus Jakarta Sans, Inter, and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#faf8f5] dark:bg-[#0c0d10] text-[#1c1d21] dark:text-[#f0eff4] antialiased selection:bg-[#1c1d21] selection:text-white font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
